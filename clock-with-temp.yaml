substitutions:
  device_name: esp32
  friendly_name: Display
  forecast_refresh_interval: 30min
  screen_timeout_seconds: "90"
  night_start_brightness: "80"
  night_brightness_step: "10"
  night_min_brightness: "50"
  # Morning: step up from the night level to 100% over this many minutes before sunrise.
  morning_ramp_minutes: "60"
  morning_step_minutes: "15"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - temperature_color.h

esp32:
  board: esp32s3box
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true

# Enable PSRAM component for large LVGL framebuffers used by mipi_rgb displays.
psram:
  mode: octal
  speed: 80MHZ
  ignore_not_found: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: !secret ap_ssid
    password: !secret ap_password

logger:
  level: INFO

api:
  password: ""
  homeassistant_states: true
  on_client_connected:
    then:
      - script.execute: update_weather_forecast

ota:
  - platform: esphome
    password: ""

# Use SNTP to get internet time. Set timezone to your local timezone.
time:
  - platform: sntp
    id: sntp_time
    timezone: "America/Chicago"
    on_time_sync:
      then:
        - script.execute: update_weather_forecast

# --- DISPLAY HARDWARE ---
# This board uses an RGB (parallel/MIPI) interface. ESPHome has a preset for
# many Waveshare ESP32-S3 boards. Pick the entry that matches your panel:
#  - For the 1024x600 variant use: model: WAVESHARE-5-1024X600
#  - If you have the 800x480 variant try the preset for your board or use the
#    custom configuration (see ESPHome mipi_rgb docs).

# I2C bus for touchscreen / peripherals (adjust pins if you wired different ones)
i2c:
  - id: bus_a
    sda: 8
    scl: 9
    scan: true

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: my_display
    update_interval: never
    auto_clear_enabled: false
    show_test_card: false
    
ch422g:
  - id: ch422g0
    i2c_id: bus_a

sensor:
  - platform: homeassistant
    id: outdoor_temp
    entity_id: !secret ha_outdoor_temp
    internal: true

  - platform: homeassistant
    id: indoor_temp
    entity_id: !secret ha_indoor_temp
    internal: true

  - platform: homeassistant
    id: feels_like_temp
    entity_id: !secret ha_feels_like_temp
    internal: true

  - platform: homeassistant
    id: minutes_since_sunset
    entity_id: sensor.display_minutes_since_sunset
    internal: true
    # Recompute brightness as soon as HA sends a value (e.g. right after boot),
    # rather than waiting for the next 1-minute update.
    on_value:
      - component.update: text_brightness

  - platform: homeassistant
    id: minutes_until_sunrise
    entity_id: sensor.display_minutes_until_sunrise
    internal: true
    on_value:
      - component.update: text_brightness

  # Normalize display values and let Home Assistant calculate feels-like.
  - platform: template
    name: "Outdoor Temperature F"
    id: outdoor_temp_f
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      if (isnan(id(outdoor_temp).state)) return NAN;
      return id(outdoor_temp).state;

  - platform: template
    name: "Indoor Temperature F"
    id: indoor_temp_f
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      if (isnan(id(indoor_temp).state)) return NAN;
      return id(indoor_temp).state;

  - platform: template
    name: "Outdoor Feels Like F"
    id: outdoor_feels_like_f
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      if (isnan(id(feels_like_temp).state)) return NAN;
      return id(feels_like_temp).state;

  # Sun-based text brightness: computed here once a minute, reported to Home
  # Assistant (shows on the device page), and applied to every label.
  - platform: template
    name: "Text Brightness"
    id: text_brightness
    unit_of_measurement: "%"
    icon: mdi:brightness-6
    accuracy_decimals: 0
    update_interval: 1min
    lambda: |-
      float since_sunset = id(minutes_since_sunset).state;
      float until_sunrise = id(minutes_until_sunrise).state;
      // Daytime (both sensors report -1 while the sun is up) or no data yet.
      if (isnan(since_sunset) || since_sunset < 0) return 100;

      // Evening: start dim, step down each hour, never below the floor.
      int night = ${night_start_brightness} - (static_cast<int>(since_sunset) / 60) * ${night_brightness_step};
      night = std::max(night, ${night_min_brightness});

      // Morning: in the last ${morning_ramp_minutes} minutes before sunrise, step from
      // the night level toward 100% every ${morning_step_minutes} minutes.
      if (!isnan(until_sunrise) && until_sunrise >= 0 && until_sunrise < ${morning_ramp_minutes}) {
        const int total_steps = ${morning_ramp_minutes} / ${morning_step_minutes};
        int steps_done = (${morning_ramp_minutes} - static_cast<int>(until_sunrise)) / ${morning_step_minutes};
        steps_done = std::min(steps_done, total_steps);
        int morning = night + (100 - night) * steps_done / total_steps;
        return morning;
      }
      return night;
    on_value:
      - lambda: |-
          uint8_t opacity = static_cast<uint8_t>((static_cast<int>(x) * 255 + 50) / 100);
          lv_obj_t *labels[] = {
            id(time_label),
            id(out_val_label), id(out_desc_label),
            id(feels_val_label), id(feels_desc_label),
            id(in_val_label), id(in_desc_label),
            id(today_date_label), id(today_condition_label), id(today_high_low_label), id(today_precip_label),
            id(next_days_title_label),
            id(day1_date_label), id(day1_condition_label), id(day1_high_low_label), id(day1_precip_label),
            id(day2_date_label), id(day2_condition_label), id(day2_high_low_label), id(day2_precip_label),
            id(day3_date_label), id(day3_condition_label), id(day3_high_low_label), id(day3_precip_label),
          };
          for (lv_obj_t *label : labels) {
            lv_obj_set_style_text_opa(label, opacity, LV_PART_MAIN);
          }
          ESP_LOGI("brightness", "Since sunset: %.0f min, until sunrise: %.0f min, brightness: %.0f%%, opacity: %u",
                   id(minutes_since_sunset).state, id(minutes_until_sunrise).state, x, opacity);

# Custom fonts for larger text display
font:
  - file: "fonts/Montserrat-Bold.ttf"
    id: montserrat_216
    size: 216
  - file: "fonts/Montserrat-Bold.ttf"
    id: montserrat_96
    size: 96
  - file: "fonts/Montserrat-Bold.ttf"
    id: montserrat_48
    size: 48
  - file: "fonts/Montserrat-Bold.ttf"
    id: montserrat_24
    size: 24
  - file: "fonts/Montserrat-Bold.ttf"
    id: montserrat_64
    size: 64
  - file: "fonts/Montserrat-Bold.ttf"
    id: montserrat_36
    size: 36

lvgl:
  displays: [my_display]
  touchscreens:
    - touchscreen_id: my_touchscreen
  update_interval: 30s
  buffer_size: 40%
  default_font: montserrat_14
  page_wrap: true
  style_definitions:
    - id: screen_style
      bg_color: 0x000000

    - id: time_style
      text_font: montserrat_216
      align: CENTER
      text_color: 0xFF9933  # Warm amber - optimal for nighttime viewing

    - id: temp_desc_style
      text_font: montserrat_24
      align: CENTER
      text_color: 0x888888

    - id: temp_value_style
      text_font: montserrat_96
      align: CENTER
      text_color: 0xFFFFFF

    - id: container_style
      bg_opa: TRANSP  # Transparent background
      border_width: 0
      pad_all: 0

    - id: forecast_date_style
      text_font: montserrat_48
      align: CENTER
      text_color: 0xFF9933

    - id: forecast_condition_style
      text_font: montserrat_36
      align: CENTER
      text_color: 0xFFFFFF

    - id: forecast_value_style
      text_font: montserrat_64
      align: CENTER
      text_color: 0xFFFFFF

    - id: today_condition_style
      text_font: montserrat_48
      align: CENTER
      text_color: 0xFFFFFF

    - id: forecast_detail_style
      text_font: montserrat_24
      align: CENTER
      text_color: 0x888888

  # A single full-screen touch target above every page handles navigation:
  # swipe left = next page, swipe right = previous page, tap = next page.
  # gesture_bubble must be off or LVGL hands swipes to the parent instead.
  top_layer:
    widgets:
      - obj:
          width: 100%
          height: 100%
          align: TOP_LEFT
          bg_opa: TRANSP
          border_width: 0
          scrollable: false
          gesture_bubble: false
          on_click:
            - script.execute: next_display_page
          on_swipe_left:
            - script.execute: next_display_page
          on_swipe_right:
            - script.execute: previous_display_page

  pages:
    - id: main_page
      styles: screen_style
      widgets:
        - label:
            id: time_label
            styles: [time_style]
            y: 20
            align: TOP_MID
            text: !lambda 'return id(sntp_time).now().strftime("%H:%M");'

        # Temperature display container using flex layout
        - obj:
            align: BOTTOM_MID
            y: -20
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            styles: [container_style]
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_column: 40  # Horizontal spacing between columns (like CSS gap)
              pad_row: 10     # Vertical spacing within columns
            widgets:
              # Outdoor temperature column
              - obj:
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: [container_style]
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        id: out_val_label
                        styles: [temp_value_style]
                        text: "--\u00B0F"
                    - label:
                        id: out_desc_label
                        styles: [temp_desc_style]
                        text: "Outside"

              # Feels-like temperature column
              - obj:
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: [container_style]
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        id: feels_val_label
                        styles: [temp_value_style]
                        text: "--\u00B0F"
                    - label:
                        id: feels_desc_label
                        styles: [temp_desc_style]
                        text: "Feels like"

              # Indoor temperature column
              - obj:
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: [container_style]
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        id: in_val_label
                        styles: [temp_value_style]
                        text: "--\u00B0F"
                    - label:
                        id: in_desc_label
                        styles: [temp_desc_style]
                        text: "Indoor"

    - id: today_page
      styles: screen_style
      widgets:
        - label:
            id: today_date_label
            styles: [forecast_date_style]
            align: TOP_MID
            y: 30
            text: "TODAY"
        - label:
            id: today_condition_label
            styles: [today_condition_style]
            align: CENTER
            y: -100
            text: "Waiting for forecast"
        - label:
            id: today_high_low_label
            recolor: true
            styles: [temp_value_style]
            align: CENTER
            y: 15
            text: "-- / --"
        - label:
            id: today_precip_label
            styles: [forecast_detail_style]
            align: BOTTOM_MID
            y: -35
            text: "High / Low (°F)  |  Precipitation: --"
    - id: next_days_page
      styles: screen_style
      widgets:
        - label:
            id: next_days_title_label
            styles: [forecast_date_style]
            align: TOP_MID
            y: 20
            text: "NEXT 3 DAYS"
        - obj:
            align: CENTER
            y: 20
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            styles: [container_style]
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_column: 20
            widgets:
              - obj:
                  width: 250
                  height: SIZE_CONTENT
                  styles: [container_style]
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    pad_row: 8
                  widgets:
                    - label:
                        id: day1_date_label
                        styles: [forecast_condition_style]
                        text: "--"
                    - label:
                        id: day1_condition_label
                        styles: [forecast_detail_style]
                        text: "--"
                    - label:
                        id: day1_high_low_label
                        recolor: true
                        styles: [forecast_value_style]
                        text: "-- / --"
                    - label:
                        id: day1_precip_label
                        styles: [forecast_detail_style]
                        text: "--%"
              - obj:
                  width: 250
                  height: SIZE_CONTENT
                  styles: [container_style]
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    pad_row: 8
                  widgets:
                    - label:
                        id: day2_date_label
                        styles: [forecast_condition_style]
                        text: "--"
                    - label:
                        id: day2_condition_label
                        styles: [forecast_detail_style]
                        text: "--"
                    - label:
                        id: day2_high_low_label
                        recolor: true
                        styles: [forecast_value_style]
                        text: "-- / --"
                    - label:
                        id: day2_precip_label
                        styles: [forecast_detail_style]
                        text: "--%"
              - obj:
                  width: 250
                  height: SIZE_CONTENT
                  styles: [container_style]
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    pad_row: 8
                  widgets:
                    - label:
                        id: day3_date_label
                        styles: [forecast_condition_style]
                        text: "--"
                    - label:
                        id: day3_condition_label
                        styles: [forecast_detail_style]
                        text: "--"
                    - label:
                        id: day3_high_low_label
                        recolor: true
                        styles: [forecast_value_style]
                        text: "-- / --"
                    - label:
                        id: day3_precip_label
                        styles: [forecast_detail_style]
                        text: "--%"
globals:
  - id: active_page
    type: int
    restore_value: no
    initial_value: "0"
  - id: last_interaction_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: last_navigation_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

button:
  - platform: template
    name: "Refresh Forecast"
    on_press:
      - script.execute: update_weather_forecast

touchscreen:
  - platform: gt911
    id: my_touchscreen
    display: my_display
    i2c_id: bus_a
    # Waveshare ESP32-S3-Touch-LCD-7: TP_IRQ on GPIO4, TP_RST on CH422G EXIO1.
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: ch422g0
      number: 1

script:
  - id: next_display_page
    mode: restart
    then:
      - if:
          condition:
            lambda: return millis() - id(last_navigation_ms) > 300;
          then:
            - lambda: |-
                id(active_page) = (id(active_page) + 1) % 3;
                id(last_interaction_ms) = millis();
                id(last_navigation_ms) = millis();
                // A swipe is followed by a click on release; ignore the rest of this touch.
                lv_indev_t *indev = lv_indev_get_act();
                if (indev != nullptr) lv_indev_wait_release(indev);
            - lvgl.page.next:
                animation: OUT_LEFT
                time: 300ms

  - id: previous_display_page
    mode: restart
    then:
      - if:
          condition:
            lambda: return millis() - id(last_navigation_ms) > 300;
          then:
            - lambda: |-
                id(active_page) = (id(active_page) + 2) % 3;
                id(last_interaction_ms) = millis();
                id(last_navigation_ms) = millis();
                // A swipe is followed by a click on release; ignore the rest of this touch.
                lv_indev_t *indev = lv_indev_get_act();
                if (indev != nullptr) lv_indev_wait_release(indev);
            - lvgl.page.previous:
                animation: OUT_RIGHT
                time: 300ms

  - id: update_weather_forecast
    mode: restart
    then:
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: !secret ha_weather
            type: daily
          capture_response: true
          on_error:
            - lambda: |-
                ESP_LOGW("weather", "weather.get_forecasts failed: %s", error.c_str());
          on_success:
            - lambda: |-
                std::string raw;
                serializeJson(response, raw);
                ESP_LOGD("weather", "Forecast response (%u bytes): %.300s", (unsigned) raw.size(), raw.c_str());

                // Accept {"response": {"weather.x": {"forecast": [...]}}} or {"weather.x": {"forecast": [...]}}.
                JsonObjectConst result = response["response"].is<JsonObjectConst>()
                                             ? response["response"].as<JsonObjectConst>()
                                             : response;
                JsonArrayConst forecast;
                for (JsonPairConst entry : result) {
                  if (entry.value()["forecast"].is<JsonArrayConst>()) {
                    forecast = entry.value()["forecast"].as<JsonArrayConst>();
                    break;
                  }
                }
                if (forecast.isNull()) {
                  ESP_LOGW("weather", "Forecast response did not contain a forecast array");
                  return;
                }

                auto as_number = [](JsonVariantConst value) -> double {
                  return value.isNull() ? NAN : value.as<double>();
                };

                auto format_condition = [](std::string value) -> std::string {
                  if (value == "partlycloudy") return "Partly cloudy";
                  if (value == "clear-night") return "Clear night";
                  if (value == "lightning-rainy") return "Thunderstorms";
                  if (value == "snowy-rainy") return "Snow and rain";
                  if (value == "windy-variant") return "Windy";
                  if (value.empty()) return "--";
                  value[0] = static_cast<char>(toupper(value[0]));
                  return value;
                };

                auto format_date = [](const std::string &value) -> std::string {
                  if (value.size() < 10) return "--";
                  int year = atoi(value.substr(0, 4).c_str());
                  int month = atoi(value.substr(5, 2).c_str());
                  int day = atoi(value.substr(8, 2).c_str());
                  static const int offsets[] = {0, 3, 2, 5, 0, 3, 5, 1, 4, 6, 2, 4};
                  static const char *weekdays[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
                  if (month < 1 || month > 12 || day < 1 || day > 31) return "--";
                  if (month < 3) year--;
                  int weekday = (year + year / 4 - year / 100 + year / 400 + offsets[month - 1] + day) % 7;
                  char text[16];
                  snprintf(text, sizeof(text), "%s %02d/%02d", weekdays[weekday], month, day);
                  return text;
                };

                lv_label_set_text(id(today_condition_label), "No forecast");
                lv_label_set_text(id(today_high_low_label), "-- / --");
                lv_label_set_text(id(today_precip_label), "High / Low (F)  |  Precipitation: --");
                lv_obj_t *date_labels[] = {id(day1_date_label), id(day2_date_label), id(day3_date_label)};
                lv_obj_t *condition_labels[] = {id(day1_condition_label), id(day2_condition_label), id(day3_condition_label)};
                lv_obj_t *high_low_labels[] = {id(day1_high_low_label), id(day2_high_low_label), id(day3_high_low_label)};
                lv_obj_t *precip_labels[] = {id(day1_precip_label), id(day2_precip_label), id(day3_precip_label)};
                for (int i = 0; i < 3; i++) {
                  lv_label_set_text(date_labels[i], "--");
                  lv_label_set_text(condition_labels[i], "--");
                  lv_label_set_text(high_low_labels[i], "-- / --");
                  lv_label_set_text(precip_labels[i], "--%");
                }

                std::string today = id(sntp_time).now().strftime("%Y-%m-%d");
                bool found_today = false;
                int next_day = 0;
                for (JsonObjectConst item : forecast) {
                  std::string datetime = item["datetime"].as<std::string>();
                  if (datetime.size() < 10) continue;
                  std::string date = datetime.substr(0, 10);
                  std::string condition = format_condition(item["condition"].as<std::string>());
                  std::string high_low = temperature_markup(as_number(item["temperature"])) + " / " +
                                         temperature_markup(as_number(item["templow"]));
                  // Prefer probability; Met.no only provides an amount (inches with imperial units).
                  std::string precip_text = "--";
                  if (!item["precipitation_probability"].isNull()) {
                    char probability[8];
                    snprintf(probability, sizeof(probability), "%.0f%%", as_number(item["precipitation_probability"]));
                    precip_text = probability;
                  } else if (!item["precipitation"].isNull()) {
                    char amount[16];
                    snprintf(amount, sizeof(amount), "%.2f in", item["precipitation"].as<float>());
                    precip_text = amount;
                  }

                  if (date == today && !found_today) {
                    found_today = true;
                    lv_label_set_text(id(today_condition_label), condition.c_str());
                    lv_label_set_text(id(today_high_low_label), high_low.c_str());
                    std::string detail = "High / Low (F)  |  Precipitation: " + precip_text;
                    lv_label_set_text(id(today_precip_label), detail.c_str());
                  } else if (date > today && next_day < 3) {
                    std::string date_text = format_date(date);
                    lv_label_set_text(date_labels[next_day], date_text.c_str());
                    lv_label_set_text(condition_labels[next_day], condition.c_str());
                    lv_label_set_text(high_low_labels[next_day], high_low.c_str());
                    lv_label_set_text(precip_labels[next_day], precip_text.c_str());
                    next_day++;
                  }
                }

                if (!found_today) {
                  lv_label_set_text(id(today_condition_label), "Today's forecast unavailable");
                }
                ESP_LOGI("weather", "Updated forecast: today=%s, upcoming days=%d", found_today ? "available" : "unavailable", next_day);

interval:
  # Update clock and temperatures every 15 seconds
  - interval: 15s
    then:
      - lambda: |-
          // Update clock
          std::string t = id(sntp_time).now().strftime("%H:%M");
          lv_label_set_text(id(time_label), t.c_str());

          // Get temperature values from template sensors
          double outf = id(outdoor_temp_f).state;
          double feels = id(outdoor_feels_like_f).state;
          double indoorf = id(indoor_temp_f).state;

          // Format temperature strings
          char out_s[32], feels_s[32], in_s[32];
          sprintf(out_s, isnan(outf) ? "--\u00B0F" : "%.0f\u00B0F", outf);
          sprintf(feels_s, isnan(feels) ? "--\u00B0F" : "%.0f\u00B0F", feels);
          sprintf(in_s, isnan(indoorf) ? "--\u00B0F" : "%.0f\u00B0F", indoorf);

          ESP_LOGI("dashboard", "T: out=%.0f feels=%.0f in=%.0f", outf, feels, indoorf);

          // Update text and color for each temperature label
          lv_label_set_text(id(out_val_label), out_s);
          lv_obj_set_style_text_color(id(out_val_label), lv_color_hex(temperature_color(outf)), LV_PART_MAIN);
          lv_event_send(id(out_val_label), lvgl::lv_update_event, nullptr);

          lv_label_set_text(id(feels_val_label), feels_s);
          lv_obj_set_style_text_color(id(feels_val_label), lv_color_hex(temperature_color(feels)), LV_PART_MAIN);
          lv_event_send(id(feels_val_label), lvgl::lv_update_event, nullptr);

          lv_label_set_text(id(in_val_label), in_s);
          lv_obj_set_style_text_color(id(in_val_label), lv_color_hex(temperature_color(indoorf)), LV_PART_MAIN);
          lv_event_send(id(in_val_label), lvgl::lv_update_event, nullptr);

  - interval: ${forecast_refresh_interval}
    then:
      - script.execute: update_weather_forecast

  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(active_page) != 0 &&
                     (millis() - id(last_interaction_ms)) >= ${screen_timeout_seconds} * 1000UL;
          then:
            - lambda: |-
                id(active_page) = 0;
                id(last_interaction_ms) = millis();
            - lvgl.page.show:
                id: main_page
                animation: OUT_RIGHT
                time: 300ms
