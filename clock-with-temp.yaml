substitutions:
  device_name: esp32
  friendly_name: Display
  forecast_refresh_interval: 30min
  screen_timeout_seconds: "90"
  night_start_brightness: "80"
  night_brightness_step: "10"
  night_min_brightness: "50"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32s3box
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true

# Enable PSRAM component for large LVGL framebuffers used by mipi_rgb displays.
psram:
  mode: octal
  speed: 80MHZ
  ignore_not_found: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: !secret ap_ssid
    password: !secret ap_password

logger:
  level: INFO

api:
  password: ""
  homeassistant_states: true
  on_client_connected:
    then:
      - script.execute: update_weather_forecast

ota:
  - platform: esphome
    password: ""

# Use SNTP to get internet time. Set timezone to your local timezone.
time:
  - platform: sntp
    id: sntp_time
    timezone: "America/Chicago"
    on_time_sync:
      then:
        - script.execute: update_weather_forecast

# --- DISPLAY HARDWARE ---
# This board uses an RGB (parallel/MIPI) interface. ESPHome has a preset for
# many Waveshare ESP32-S3 boards. Pick the entry that matches your panel:
#  - For the 1024x600 variant use: model: WAVESHARE-5-1024X600
#  - If you have the 800x480 variant try the preset for your board or use the
#    custom configuration (see ESPHome mipi_rgb docs).

# I2C bus for touchscreen / peripherals (adjust pins if you wired different ones)
i2c:
  - id: bus_a
    sda: 8
    scl: 9
    scan: true

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: my_display
    update_interval: never
    auto_clear_enabled: false
    show_test_card: false
    
ch422g:
  - id: ch422g0
    i2c_id: bus_a

sensor:
  - platform: homeassistant
    id: outdoor_temp
    entity_id: !secret ha_outdoor_temp
    internal: true

  - platform: homeassistant
    id: indoor_temp
    entity_id: !secret ha_indoor_temp
    internal: true

  - platform: homeassistant
    id: feels_like_temp
    entity_id: !secret ha_feels_like_temp
    internal: true

  - platform: homeassistant
    id: minutes_since_sunset
    entity_id: sensor.display_minutes_since_sunset
    internal: true

  # Normalize display values and let Home Assistant calculate feels-like.
  - platform: template
    name: "Outdoor Temperature F"
    id: outdoor_temp_f
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      if (isnan(id(outdoor_temp).state)) return NAN;
      return id(outdoor_temp).state;

  - platform: template
    name: "Indoor Temperature F"
    id: indoor_temp_f
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      if (isnan(id(indoor_temp).state)) return NAN;
      return id(indoor_temp).state;

  - platform: template
    name: "Outdoor Feels Like F"
    id: outdoor_feels_like_f
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      if (isnan(id(feels_like_temp).state)) return NAN;
      return id(feels_like_temp).state;

# Custom fonts for larger text display
font:
  - file: "fonts/Montserrat-Bold.ttf"
    id: montserrat_216
    size: 216
  - file: "fonts/Montserrat-Bold.ttf"
    id: montserrat_96
    size: 96
  - file: "fonts/Montserrat-Bold.ttf"
    id: montserrat_48
    size: 48
  - file: "fonts/Montserrat-Bold.ttf"
    id: montserrat_24
    size: 24
  - file: "fonts/Montserrat-Bold.ttf"
    id: montserrat_18
    size: 18

lvgl:
  displays: [my_display]
  touchscreens:
    - touchscreen_id: my_touchscreen
  update_interval: 30s
  buffer_size: 40%
  default_font: montserrat_14
  page_wrap: true
  style_definitions:
    - id: screen_style
      bg_color: 0x000000

    - id: time_style
      text_font: montserrat_216
      align: CENTER
      text_color: 0xFF9933  # Warm amber - optimal for nighttime viewing

    - id: temp_desc_style
      text_font: montserrat_24
      align: CENTER
      text_color: 0x888888

    - id: temp_value_style
      text_font: montserrat_96
      align: CENTER
      text_color: 0xFFFFFF

    - id: container_style
      bg_opa: TRANSP  # Transparent background
      border_width: 0
      pad_all: 0

    - id: forecast_date_style
      text_font: montserrat_48
      align: CENTER
      text_color: 0xFF9933

    - id: forecast_condition_style
      text_font: montserrat_24
      align: CENTER
      text_color: 0xFFFFFF

    - id: forecast_value_style
      text_font: montserrat_48
      align: CENTER
      text_color: 0xFFFFFF

    - id: forecast_detail_style
      text_font: montserrat_18
      align: CENTER
      text_color: 0x888888

  pages:
    - id: main_page
      styles: screen_style
      widgets:
        - label:
            id: time_label
            styles: [time_style]
            y: 20
            align: TOP_MID
            text: !lambda 'return id(sntp_time).now().strftime("%H:%M");'

        # Temperature display container using flex layout
        - obj:
            align: BOTTOM_MID
            y: -20
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            styles: [container_style]
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_column: 40  # Horizontal spacing between columns (like CSS gap)
              pad_row: 10     # Vertical spacing within columns
            widgets:
              # Outdoor temperature column
              - obj:
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: [container_style]
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        id: out_val_label
                        styles: [temp_value_style]
                        text: "--\u00B0F"
                    - label:
                        id: out_desc_label
                        styles: [temp_desc_style]
                        text: "Outside"

              # Feels-like temperature column
              - obj:
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: [container_style]
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        id: feels_val_label
                        styles: [temp_value_style]
                        text: "--\u00B0F"
                    - label:
                        id: feels_desc_label
                        styles: [temp_desc_style]
                        text: "Feels like"

              # Indoor temperature column
              - obj:
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: [container_style]
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        id: in_val_label
                        styles: [temp_value_style]
                        text: "--\u00B0F"
                    - label:
                        id: in_desc_label
                        styles: [temp_desc_style]
                        text: "Indoor"

        - obj:
            width: 100%
            height: 100%
            align: TOP_LEFT
            bg_opa: TRANSP
            border_width: 0
            on_click:
              - script.execute: next_display_page
            on_swipe_left:
              - script.execute: next_display_page
            on_swipe_right:
              - script.execute: previous_display_page

    - id: today_page
      styles: screen_style
      widgets:
        - label:
            id: today_date_label
            styles: [forecast_date_style]
            align: TOP_MID
            y: 30
            text: "TODAY"
        - label:
            id: today_condition_label
            styles: [forecast_condition_style]
            align: CENTER
            y: -70
            text: "Waiting for forecast"
        - label:
            id: today_high_low_label
            styles: [forecast_value_style]
            align: CENTER
            y: 10
            text: "-- / --"
        - label:
            id: today_precip_label
            styles: [forecast_detail_style]
            align: BOTTOM_MID
            y: -35
            text: "High / Low (°F)  |  Precipitation: --"
        - obj:
            width: 100%
            height: 100%
            align: TOP_LEFT
            bg_opa: TRANSP
            border_width: 0
            on_click:
              - script.execute: next_display_page
            on_swipe_left:
              - script.execute: next_display_page
            on_swipe_right:
              - script.execute: previous_display_page

    - id: next_days_page
      styles: screen_style
      widgets:
        - label:
            styles: [forecast_date_style]
            align: TOP_MID
            y: 20
            text: "NEXT 3 DAYS"
        - obj:
            align: CENTER
            y: 20
            width: 100%
            height: SIZE_CONTENT
            styles: [container_style]
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_column: 12
            widgets:
              - obj:
                  width: 30%
                  height: SIZE_CONTENT
                  styles: [container_style]
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    pad_row: 8
                  widgets:
                    - label:
                        id: day1_date_label
                        styles: [forecast_condition_style]
                        text: "--"
                    - label:
                        id: day1_condition_label
                        styles: [forecast_detail_style]
                        text: "--"
                    - label:
                        id: day1_high_low_label
                        styles: [forecast_value_style]
                        text: "-- / --"
                    - label:
                        id: day1_precip_label
                        styles: [forecast_detail_style]
                        text: "--%"
              - obj:
                  width: 30%
                  height: SIZE_CONTENT
                  styles: [container_style]
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    pad_row: 8
                  widgets:
                    - label:
                        id: day2_date_label
                        styles: [forecast_condition_style]
                        text: "--"
                    - label:
                        id: day2_condition_label
                        styles: [forecast_detail_style]
                        text: "--"
                    - label:
                        id: day2_high_low_label
                        styles: [forecast_value_style]
                        text: "-- / --"
                    - label:
                        id: day2_precip_label
                        styles: [forecast_detail_style]
                        text: "--%"
              - obj:
                  width: 30%
                  height: SIZE_CONTENT
                  styles: [container_style]
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    pad_row: 8
                  widgets:
                    - label:
                        id: day3_date_label
                        styles: [forecast_condition_style]
                        text: "--"
                    - label:
                        id: day3_condition_label
                        styles: [forecast_detail_style]
                        text: "--"
                    - label:
                        id: day3_high_low_label
                        styles: [forecast_value_style]
                        text: "-- / --"
                    - label:
                        id: day3_precip_label
                        styles: [forecast_detail_style]
                        text: "--%"
        - obj:
            width: 100%
            height: 100%
            align: TOP_LEFT
            bg_opa: TRANSP
            border_width: 0
            on_click:
              - script.execute: next_display_page
            on_swipe_left:
              - script.execute: next_display_page
            on_swipe_right:
              - script.execute: previous_display_page

globals:
  - id: active_page
    type: int
    restore_value: no
    initial_value: "0"
  - id: last_interaction_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: last_navigation_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

touchscreen:
  - platform: gt911
    id: my_touchscreen
    display: my_display

script:
  - id: next_display_page
    mode: restart
    then:
      - if:
          condition:
            lambda: return millis() - id(last_navigation_ms) > 300;
          then:
            - lambda: |-
                id(active_page) = (id(active_page) + 1) % 3;
                id(last_interaction_ms) = millis();
                id(last_navigation_ms) = millis();
            - lvgl.page.next:
                animation: OUT_LEFT
                time: 300ms

  - id: previous_display_page
    mode: restart
    then:
      - if:
          condition:
            lambda: return millis() - id(last_navigation_ms) > 300;
          then:
            - lambda: |-
                id(active_page) = (id(active_page) + 2) % 3;
                id(last_interaction_ms) = millis();
                id(last_navigation_ms) = millis();
            - lvgl.page.previous:
                animation: OUT_RIGHT
                time: 300ms

  - id: update_weather_forecast
    mode: restart
    then:
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: !secret ha_weather
            type: daily
          capture_response: true
          on_success:
            - lambda: |-
                JsonObjectConst result = response["response"].as<JsonObjectConst>();
                if (result.isNull() || result.size() == 0) {
                  ESP_LOGW("weather", "Home Assistant returned no forecast response");
                  return;
                }

                JsonObjectConst weather = result.begin()->value().as<JsonObjectConst>();
                JsonArrayConst forecast = weather["forecast"].as<JsonArrayConst>();
                if (forecast.isNull()) {
                  ESP_LOGW("weather", "Forecast response did not contain a forecast array");
                  return;
                }

                auto format_temperature = [](JsonVariantConst value) -> std::string {
                  if (value.isNull()) return "--";
                  char text[12];
                  snprintf(text, sizeof(text), "%.0f", value.as<float>());
                  return text;
                };

                auto format_condition = [](std::string value) -> std::string {
                  if (value == "partlycloudy") return "Partly cloudy";
                  if (value == "clear-night") return "Clear night";
                  if (value == "lightning-rainy") return "Thunderstorms";
                  if (value == "snowy-rainy") return "Snow and rain";
                  if (value == "windy-variant") return "Windy";
                  if (value.empty()) return "--";
                  value[0] = static_cast<char>(toupper(value[0]));
                  return value;
                };

                auto format_date = [](const std::string &value) -> std::string {
                  if (value.size() < 10) return "--";
                  int year = atoi(value.substr(0, 4).c_str());
                  int month = atoi(value.substr(5, 2).c_str());
                  int day = atoi(value.substr(8, 2).c_str());
                  static const int offsets[] = {0, 3, 2, 5, 0, 3, 5, 1, 4, 6, 2, 4};
                  static const char *weekdays[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
                  if (month < 1 || month > 12 || day < 1 || day > 31) return "--";
                  if (month < 3) year--;
                  int weekday = (year + year / 4 - year / 100 + year / 400 + offsets[month - 1] + day) % 7;
                  char text[16];
                  snprintf(text, sizeof(text), "%s %02d/%02d", weekdays[weekday], month, day);
                  return text;
                };

                lv_label_set_text(id(today_condition_label), "No forecast");
                lv_label_set_text(id(today_high_low_label), "-- / --");
                lv_label_set_text(id(today_precip_label), "High / Low (F)  |  Precipitation: --");
                lv_obj_t *date_labels[] = {id(day1_date_label), id(day2_date_label), id(day3_date_label)};
                lv_obj_t *condition_labels[] = {id(day1_condition_label), id(day2_condition_label), id(day3_condition_label)};
                lv_obj_t *high_low_labels[] = {id(day1_high_low_label), id(day2_high_low_label), id(day3_high_low_label)};
                lv_obj_t *precip_labels[] = {id(day1_precip_label), id(day2_precip_label), id(day3_precip_label)};
                for (int i = 0; i < 3; i++) {
                  lv_label_set_text(date_labels[i], "--");
                  lv_label_set_text(condition_labels[i], "--");
                  lv_label_set_text(high_low_labels[i], "-- / --");
                  lv_label_set_text(precip_labels[i], "--%");
                }

                std::string today = id(sntp_time).now().strftime("%Y-%m-%d");
                bool found_today = false;
                int next_day = 0;
                for (JsonObjectConst item : forecast) {
                  std::string datetime = item["datetime"].as<std::string>();
                  if (datetime.size() < 10) continue;
                  std::string date = datetime.substr(0, 10);
                  std::string condition = format_condition(item["condition"].as<std::string>());
                  std::string high = format_temperature(item["temperature"]);
                  std::string low = format_temperature(item["templow"]);
                  std::string precip = format_temperature(item["precipitation_probability"]);
                  std::string high_low = high + " / " + low;
                  std::string precip_text = precip + "%";

                  if (date == today && !found_today) {
                    found_today = true;
                    lv_label_set_text(id(today_condition_label), condition.c_str());
                    lv_label_set_text(id(today_high_low_label), high_low.c_str());
                    std::string detail = "High / Low (F)  |  Precipitation: " + precip_text;
                    lv_label_set_text(id(today_precip_label), detail.c_str());
                  } else if (date > today && next_day < 3) {
                    std::string date_text = format_date(date);
                    lv_label_set_text(date_labels[next_day], date_text.c_str());
                    lv_label_set_text(condition_labels[next_day], condition.c_str());
                    lv_label_set_text(high_low_labels[next_day], high_low.c_str());
                    lv_label_set_text(precip_labels[next_day], precip_text.c_str());
                    next_day++;
                  }
                }

                if (!found_today) {
                  lv_label_set_text(id(today_condition_label), "Today's forecast unavailable");
                }
                ESP_LOGI("weather", "Updated forecast: today=%s, upcoming days=%d", found_today ? "available" : "unavailable", next_day);

interval:
  # Update clock and temperatures every 15 seconds
  - interval: 15s
    then:
      - lambda: |-
          // Update clock
          std::string t = id(sntp_time).now().strftime("%H:%M");
          lv_label_set_text(id(time_label), t.c_str());

          // Get temperature values from template sensors
          double outf = id(outdoor_temp_f).state;
          double feels = id(outdoor_feels_like_f).state;
          double indoorf = id(indoor_temp_f).state;

          // Format temperature strings
          char out_s[32], feels_s[32], in_s[32];
          sprintf(out_s, isnan(outf) ? "--\u00B0F" : "%.0f\u00B0F", outf);
          sprintf(feels_s, isnan(feels) ? "--\u00B0F" : "%.0f\u00B0F", feels);
          sprintf(in_s, isnan(indoorf) ? "--\u00B0F" : "%.0f\u00B0F", indoorf);

          ESP_LOGI("dashboard", "T: out=%.0f feels=%.0f in=%.0f", outf, feels, indoorf);

          // Helper to compute temperature color gradient and apply to label
          auto apply_color = [&](auto label_id, double v) {
            uint8_t r = 255, g = 255, b = 255;
            if (!isnan(v)) {
              if (v <= 0.0) {
                r = 0; g = 120; b = 255;  // Bright blue
              } else if (v < 32.0) {
                double t = v / 32.0;
                r = 0;
                g = (uint8_t)round(120 + 40 * t);
                b = (uint8_t)round(255 - 35 * t);
              } else if (v < 72.0) {
                double t = (v - 32.0) / 40.0;
                r = 0;
                g = (uint8_t)round(160 + 40 * t);
                b = (uint8_t)round(220 - 220 * t);
              } else if (v < 90.0) {
                double t = (v - 72.0) / 18.0;
                r = (uint8_t)round(255 * t);
                g = (uint8_t)round(200 - 160 * t);
                b = 0;
              } else {
                r = 255; g = 40; b = 0;  // Bright red
              }
            }
            lv_obj_set_style_text_color(label_id, lv_color_make(r, g, b), LV_PART_MAIN);
          };

          // Update text and color for each temperature label
          lv_label_set_text(id(out_val_label), out_s);
          apply_color(id(out_val_label), outf);
          lv_event_send(id(out_val_label), lvgl::lv_update_event, nullptr);

          lv_label_set_text(id(feels_val_label), feels_s);
          apply_color(id(feels_val_label), feels);
          lv_event_send(id(feels_val_label), lvgl::lv_update_event, nullptr);

          lv_label_set_text(id(in_val_label), in_s);
          apply_color(id(in_val_label), indoorf);
          lv_event_send(id(in_val_label), lvgl::lv_update_event, nullptr);

  - interval: ${forecast_refresh_interval}
    then:
      - script.execute: update_weather_forecast

  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(active_page) != 0 &&
                     (millis() - id(last_interaction_ms)) >= ${screen_timeout_seconds} * 1000UL;
          then:
            - lambda: |-
                id(active_page) = 0;
                id(last_interaction_ms) = millis();
            - lvgl.page.show:
                id: main_page
                animation: OUT_RIGHT
                time: 300ms

  # Apply the Home Assistant sun-based brightness schedule to all text.
  - interval: 1min
    then:
      - lambda: |-
          int brightness = 100;
          if (!isnan(id(minutes_since_sunset).state) && id(minutes_since_sunset).state >= 0) {
            int elapsed_hours = static_cast<int>(id(minutes_since_sunset).state) / 60;
            brightness = ${night_start_brightness} - elapsed_hours * ${night_brightness_step};
            if (brightness < ${night_min_brightness}) brightness = ${night_min_brightness};
          }
          uint8_t opacity = static_cast<uint8_t>((brightness * 255 + 50) / 100);

          lv_obj_set_style_text_opa(id(time_label), opacity, LV_PART_MAIN);
          lv_obj_set_style_text_opa(id(out_val_label), opacity, LV_PART_MAIN);
          lv_obj_set_style_text_opa(id(out_desc_label), opacity, LV_PART_MAIN);
          lv_obj_set_style_text_opa(id(feels_val_label), opacity, LV_PART_MAIN);
          lv_obj_set_style_text_opa(id(feels_desc_label), opacity, LV_PART_MAIN);
          lv_obj_set_style_text_opa(id(in_val_label), opacity, LV_PART_MAIN);
          lv_obj_set_style_text_opa(id(in_desc_label), opacity, LV_PART_MAIN);
          lv_obj_set_style_text_opa(id(today_date_label), opacity, LV_PART_MAIN);
          lv_obj_set_style_text_opa(id(today_condition_label), opacity, LV_PART_MAIN);
          lv_obj_set_style_text_opa(id(today_high_low_label), opacity, LV_PART_MAIN);
          lv_obj_set_style_text_opa(id(today_precip_label), opacity, LV_PART_MAIN);

          lv_obj_t *forecast_labels[] = {
            id(day1_date_label), id(day1_condition_label), id(day1_high_low_label), id(day1_precip_label),
            id(day2_date_label), id(day2_condition_label), id(day2_high_low_label), id(day2_precip_label),
            id(day3_date_label), id(day3_condition_label), id(day3_high_low_label), id(day3_precip_label)
          };
          for (lv_obj_t *label : forecast_labels) {
            lv_obj_set_style_text_opa(label, opacity, LV_PART_MAIN);
          }

          ESP_LOGI("brightness", "Minutes since sunset: %.0f, brightness: %d%%, opacity: %u",
                   id(minutes_since_sunset).state, brightness, opacity);

